<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little House</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }
        .rotate-notice {
            position: fixed;
            inset: 0;
            background-color: #222835;
            color: white;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            font-size: 22px;
        }
        /* 註釋咗強制要橫屏嘅規則，直放都可以睇 */
        /*
        @media (orientation:portrait) {
            .rotate-notice {
                display: flex;
            }
            .start-screen, .house-scene {
                display: none !important;
            }
        }
        */
        .start-screen {
            position: fixed;
            inset: 0;
            background-color: #222835;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 998;
            transition: opacity 1.2s ease;
        }
        .start-title {
            font-size: 44px;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }
        .start-subtitle {
            font-size: 18px;
            opacity: 0.7;
            margin-bottom: 45px;
        }
        .enter-button {
            padding: 15px 40px;
            background-color: #c99c6d;
            border: none;
            border-radius: 999px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }
        .enter-button:hover {
            transform: scale(1.06);
            background-color: #daad7e;
        }
        .house-scene {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: none;
        }
        .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
        }
        .house-background {
            width: 100%;
            height: 100%;
            background: url("./mon_gate_western_open_half.png") center / cover no-repeat;
            position: absolute;
            inset: 0;
        }
        .clickable-item {
            position: absolute;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .clickable-item:hover {
            filter: brightness(1.2);
            transform: scale(1.08);
        }
        .door {
            width: 120px;
            height: 180px;
            bottom: 180px;
            left: 140px;
            /* 如果你之後有門嘅圖，就喺呢度換檔名 */
        }
        .vinyl-record {
            width: 90px;
            height: 90px;
            bottom: 220px;
            right: 180px;
            background: url("./music_record_disc.png") center / contain no-repeat;
        }
        .vinyl-record.spin {
            animation: rotateDisk 8s linear infinite;
        }
        @keyframes rotateDisk {
            from {transform: rotate(0deg);}
            to {transform: rotate(360deg);}
        }
        .envelope {
            width: 80px;
            height: 60px;
            bottom: 240px;
            left: 220px;
            background: url("./christmas_card04.jpg") center / contain no-repeat;
        }
        .letter-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .letter-box {
            width: min(560px, 90vw);
            background-color: #f8f3e8;
            color: #222222;
            padding: 40px 36px;
            border-radius: 10px;
            position: relative;
            line-height: 1.8;
            font-size: 17px;
        }
        .close-letter {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 24px;
            cursor: pointer;
            color: #666666;
        }
        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="rotate-notice">
        <div style="font-size:48px;margin-bottom:20px;">📱</div>
        Please rotate your device to landscape mode to view this page.
    </div>
    <div class="start-screen" id="startScreen">
        <div class="start-title">Our Little House</div>
        <div class="start-subtitle">Memories that belong to us</div>
        <button class="enter-button" onclick="goInside()">Enter House</button>
    </div>
    <div class="house-scene" id="houseScene">
        <div class="house-background"></div>
        <div class="clickable-item door"></div>
        <div class="clickable-item vinyl-record" id="recordEl"></div>
        <div class="clickable-item envelope" id="envelopeEl"></div>
    </div>
    <div class="letter-overlay" id="letterOverlay">
        <div class="letter-box">
            <span class="close-letter" onclick="shutLetter()">×</span>
            Dear you,<br><br>
            Write your words here.
        </div>
    </div>
    <audio id="bgAudio" src="./leberch-christmas-440431.mp3" loop>
    <script>
        const startScreen = document.getElementById("startScreen");
        const houseScene = document.getElementById("houseScene");
        const recordEl = document.getElementById("recordEl");
        const envelopeEl = document.getElementById("envelopeEl");
        const letterOverlay = document.getElementById("letterOverlay");
        const bgAudio = document.getElementById("bgAudio");
        let musicOn = false;
        function goInside(){
            startScreen.style.opacity = "0";
            setTimeout(()=>{
                startScreen.style.display = "none";
                houseScene.style.display = "block";
                makeSnow();
            },1200);
        }
        function makeSnow(){
            for(let i=0;i<60;i++){
                const flake = document.createElement("div");
                flake.classList.add("snowflake");
                const size = Math.random()*6+2;
                flake.style.width = size+"px";
                flake.style.height = size+"px";
                flake.style.left = Math.random()*100+"vw";
                flake.style.top = -10+"vh";
                houseScene.appendChild(flake);
                fallSnow(flake);
            }
        }
        function fallSnow(flake){
            const fallTime = Math.random()*12+8;
            flake.style.transition = `top ${fallTime}s linear`;
            flake.style.top = "100vh";
            setTimeout(()=>{
                flake.style.top = "-10vh";
                fallSnow(flake);
            },fallTime*1000);
        }
        recordEl.addEventListener("click",()=>{
            if(!musicOn){
                bgAudio.play();
                recordEl.classList.add("spin");
                musicOn = true;
            }else{
                bgAudio.pause();
                recordEl.classList.remove("spin");
                musicOn = false;
            }
        })
        envelopeEl.addEventListener("click",()=>{
            letterOverlay.style.display = "flex";
        })
        function shutLetter(){
            letterOverlay.style.display = "none";
        }
        letterOverlay.addEventListener("click",(ev)=>{
            if(ev.target === letterOverlay) shutLetter();
        })
    </script>
</body>
</html>
