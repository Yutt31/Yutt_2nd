<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YUTT 小家</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f8f2e4;
    }
    .container {
        width: 100vw;
        height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* 大门区域 */
    .door-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        width: min(420px, 75vw);
        cursor: pointer;
    }
    .door-img {
        width: 100%;
        display: block;
    }

    /* 邮箱 */
    .mailbox-wrapper {
        position: absolute;
        bottom: 12vh;
        left: calc(50% - 240px);
        width: min(130px, 22vw);
        cursor: pointer;
    }
    .mailbox-img {
        width: 100%;
        display: block;
    }

    /* 弹窗遮罩 */
    .overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0,0,0,0.35);
        z-index: 99;
        display: none;
    }
    .mail-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #fffef0;
        border: 4px solid #b88c58;
        border-radius: 14px;
        padding: 28px;
        width: min(320px, 85vw);
        z-index: 100;
        display: none;
    }
    .mail-modal h4 {
        font-size: 22px;
        color: #5a4220;
        margin-bottom:12px;
    }
    .mail-modal p {
        color:#666;
        line-height:1.7;
        margin-bottom:20px;
    }
    .close-btn {
        padding:7px 16px;
        background-color:#d4b47c;
        border:none;
        border-radius:6px;
        font-size:16px;
        color:#4a3818;
        cursor:pointer;
    }
</style>
</head>
<body>
<div class="container">
    <!-- 大门 -->
    <div class="door-wrapper" id="doorWrap">
        <img class="door-img" id="doorImg" src="door_close.jpeg.png" alt="大门">
    </div>

    <!-- 邮箱 -->
    <div class="mailbox-wrapper" id="mailWrap">
        <img class="mailbox-img" id="mailImg" src="mailbox_close.jpeg.png" alt="邮箱">
    </div>

    <!-- 信件弹窗 -->
    <div class="overlay" id="overlay"></div>
    <div class="mail-modal" id="mailModal">
        <h4>📮 邮箱来信</h4>
        <p>欢迎来到 YUTT 小家✨<br>这里存放着一些温柔的小秘密。</p>
        <button class="close-btn" id="closeModal">关闭</button>
    </div>
</div>

<script>
    // 大门开关逻辑
    const doorImg = document.getElementById("doorImg");
    let doorIsOpen = false;
    document.getElementById("doorWrap").addEventListener("click", ()=>{
        if(!doorIsOpen){
            doorImg.src = "door_open.jpeg.png";
            doorIsOpen = true;
        }else{
            doorImg.src = "door_close.jpeg.png";
            doorIsOpen = false;
        }
    });

    // 邮箱逻辑
    const mailImg = document.getElementById("mailImg");
    const overlay = document.getElementById("overlay");
    const mailModal = document.getElementById("mailModal");
    const closeModalBtn = document.getElementById("closeModal");
    let mailOpened = false;

    document.getElementById("mailWrap").addEventListener("click", ()=>{
        mailImg.src = "mailbox_open.jpeg.png";
        mailOpened = true;
        overlay.style.display = "block";
        mailModal.style.display = "block";
    });

    function closeMailBox(){
        mailImg.src = "mailbox_close.jpeg.png";
        mailOpened = false;
        overlay.style.display = "none";
        mailModal.style.display = "none";
    }
    closeModalBtn.addEventListener("click", closeMailBox);
    overlay.addEventListener("click", closeMailBox);
</script>
</body>
</html>
